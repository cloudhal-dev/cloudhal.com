  - '@cloudhal/cli@0.1.1'
  - '@cloudhal/cloudflare@0.1.1'
  - '@cloudhal/comments@0.1.1'
  - '@cloudhal/core-contracts@0.1.1'
  - '@cloudhal/core-ts@0.1.1'
  - '@cloudhal/mcp-server@0.1.1'
  - '@cloudhal/schedules@0.1.1'
  - '@cloudhal/storage@0.1.1'
